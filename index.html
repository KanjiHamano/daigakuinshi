<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>応化 院試情報共有（β版）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 1160px max container. Sticky header → page body. Detail pages = main + right aux nav (2 columns on PC, 1 column on phones). */
:root{
  color-scheme:light;
  --bg:#F5F9FF; --surface:#FFFFFF; --surface-2:#EDF4FF; --fg:#172C48; --muted:#53657D; --line:#D9E5F4;
  --accent:#2164D7; --accent-strong:#174CA6; --accent-soft:#E8F1FF; --on-accent:#FFFFFF;
  --demo-bg:#FBF1DA; --demo-fg:#664500; --demo-line:#E3C98B; --danger:#A3352B; --danger-soft:#FBE9E6;
  --bar-1:#2164D7; --bar-2:#6297ED; --bar-3:#B4D0FF;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  --radius:8px; --hh:112px; --maxw:1160px;
}
*{box-sizing:border-box}
html{scroll-padding-top:var(--hh)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0}
a{color:var(--accent-strong)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.container{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[id]{scroll-margin-top:var(--hh)}
.icon{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Header ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.demo-strip{background:var(--demo-bg);color:var(--demo-fg);border-bottom:1px solid var(--demo-line);font-size:13px;line-height:1.5}
.demo-strip-in{display:flex;flex-wrap:wrap;gap:4px 16px;padding-block:5px}
.demo-strip strong{font-weight:700}
.header-in{display:flex;align-items:center;gap:16px;min-height:72px;padding-block:8px}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--fg);margin-right:auto;min-width:0}
.brand-name{font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap}
.brand-name small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;font-size:12px;line-height:1;padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.badge-beta{border-color:var(--accent);color:var(--accent-strong);font-weight:700}
.gnav{display:flex;align-items:stretch;gap:2px}
.gnav-item{position:relative;display:flex}
.gnav-link{display:flex;align-items:center;gap:4px;padding:0 12px;min-height:44px;text-decoration:none;color:var(--fg);border-radius:6px;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
.gnav-link:hover{background:var(--surface-2)}
.gnav-link.is-current{color:var(--accent-strong);font-weight:700;border-bottom-color:var(--accent);border-radius:6px 6px 0 0}
.gnav-link .icon{width:14px;height:14px}
.gnav-sub{display:none;position:absolute;top:100%;left:0;min-width:240px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.08);padding:6px;z-index:5}
.gnav-item.has-sub:hover .gnav-sub,.gnav-item.has-sub:focus-within .gnav-sub{display:block}
.gnav-sub a{display:flex;align-items:center;min-height:40px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--fg);font-size:15px}
.gnav-sub a:hover{background:var(--surface-2)}
.gnav-sub a[aria-current="page"]{color:var(--accent-strong);font-weight:700;background:var(--accent-soft)}
.header-actions{display:flex;gap:6px}
.icon-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:48px;min-height:48px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:11px;line-height:1.2}
.icon-btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn .icon{width:22px;height:22px}
.mobile-search{padding-block:0 12px}

/* ---------- Search ---------- */
.search{position:relative;width:240px}
.mobile-search .search{width:100%}
.search-field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 4px 0 10px;min-height:44px}
.search-field:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.search-field input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font-size:15px;outline:none}
.search-clear{border:0;background:transparent;min-width:36px;min-height:36px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.search-clear:hover{background:var(--surface-2)}
.search-panel{position:absolute;right:0;top:calc(100% + 6px);width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.12);padding:8px;z-index:50}
.mobile-search .search-panel{position:static;width:100%;margin-top:8px;box-shadow:none}
.search-count{font-size:13px;color:var(--muted);padding:4px 8px}
.search-results{list-style:none;max-height:340px;overflow:auto}
.search-results button{width:100%;text-align:left;display:flex;flex-direction:column;gap:0;padding:8px 10px;min-height:48px;border:0;background:transparent;border-radius:6px;cursor:pointer}
.search-results button:hover,.search-results button:focus-visible{background:var(--surface-2)}
.search-results .r-title{font-weight:700;font-size:15px}
.search-results .r-cat{font-size:13px;color:var(--muted)}
.search-results mark{background:var(--accent-soft);color:inherit;border-radius:2px}
.search-empty{padding:8px;font-size:14px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:36px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--accent)}

/* ---------- Drawer ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,20,.45);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--surface);z-index:71;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:16px}
.drawer-body{overflow:auto;padding:8px 8px 24px;flex:1}
.drawer-note{margin:12px 8px 0;font-size:13px;color:var(--muted)}
.dnav{list-style:none;display:grid;gap:2px}
.dnav-link{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:16px}
.dnav-link:hover{background:var(--surface-2)}
.dnav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.dnav-sub{list-style:none;display:grid;gap:2px;padding:2px 0 6px 18px}
.dnav-sub .dnav-link{font-size:15px;min-height:44px}

/* ---------- Accordion (shared: FAQ, materials, drawer, footer, TOC) ---------- */
.acc{border-bottom:1px solid var(--line)}
.acc-h{font-size:inherit;font-weight:inherit;margin:0}
.acc-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:10px 12px;border:0;background:transparent;cursor:pointer;border-radius:8px;font-weight:700;font-size:16px;line-height:1.5}
.acc-btn:hover{background:var(--surface-2)}
.acc-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.acc-meta{font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap}
.acc-state{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.acc-state .icon{width:20px;height:20px;transition:transform .15s}
.acc.is-open > .acc-h .acc-state .icon{transform:rotate(180deg)}
.acc.is-open > .acc-h .acc-btn{color:var(--accent-strong)}
@media (prefers-reduced-motion:reduce){.acc-state .icon{transition:none}}
.acc-panel{padding:4px 12px 16px}
.acc--nav{border-bottom:0}
.acc--nav .acc-btn{min-height:48px;font-weight:400;padding:8px 12px}
.acc--nav.is-current > .acc-h .acc-btn{font-weight:700;color:var(--accent-strong)}
.acc--nav .acc-panel{padding:0}
.acc-group{border-top:1px solid var(--line)}
.acc--box{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.acc--box .acc-panel{padding:0 16px 14px}

/* ---------- Generic ---------- */
main{display:block;min-height:60vh}
.page{padding-block:20px 56px}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:14px;color:var(--muted)}
.crumbs li{display:flex;align-items:center;gap:6px}
.crumbs li+li::before{content:"›";color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;display:inline-flex;min-height:32px;align-items:center}
.crumbs [aria-current]{color:var(--fg)}
.page-head{display:grid;gap:10px;margin:14px 0 20px}
.page-head h1{font-size:clamp(24px,3.2vw,30px)}
.page-head h1:focus{outline:none}
.lead{color:var(--fg);max-width:44em}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.part-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent-strong);font-size:13px;font-weight:700}
.part-tag.p2{background:var(--surface-2);color:var(--fg);border:1px dashed var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:12px;line-height:1.3;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:400;letter-spacing:0}
.demo-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.3;padding:3px 8px;border-radius:4px;background:var(--demo-bg);color:var(--demo-fg);border:1px solid var(--demo-line);font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;cursor:pointer;font-size:16px}
.btn:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-sub{background:var(--surface);color:var(--accent-strong)}
.btn-sub:hover{background:var(--accent-soft);color:var(--accent-strong)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--surface-2);border:1px dashed var(--muted);color:var(--muted);cursor:not-allowed}
.btn-sm{min-height:44px;padding:8px 14px;font-size:15px}
.section{margin-top:44px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
.section-head h2{font-size:22px}
.section-head p{color:var(--muted);font-size:15px;flex-basis:100%}
.note{font-size:14px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.demo-box{background:var(--demo-bg);border:1px solid var(--demo-line);color:var(--demo-fg);border-radius:var(--radius);padding:14px 16px;display:grid;gap:6px;font-size:15px}
.demo-box strong{font-size:16px}
.demo-box ul{padding-left:1.2em;display:grid;gap:2px}

/* ---------- Cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;list-style:none}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card-link{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;height:100%;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--fg);min-height:88px}
.card-link:hover{border-color:var(--accent);background:var(--surface)}
.card-link:hover .card-arrow{transform:translateX(3px)}
.card-ico{width:44px;height:44px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center}
.card-ico .icon{width:24px;height:24px}
.card-body{display:grid;gap:2px;min-width:0}
.card-title{font-weight:700;font-size:17px}
.card-desc{font-size:14px;color:var(--muted);line-height:1.6}
.card-arrow{color:var(--accent);transition:transform .15s}
@media (prefers-reduced-motion:reduce){.card-arrow{transition:none}}
.card-num{font-size:12px;color:var(--muted)}

/* ---------- Home ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px 32px;align-items:center;padding-block:28px 8px}
.intro h1{font-size:clamp(24px,3.4vw,32px)}
.intro-text{display:grid;gap:12px}
.intro-actions{display:grid;gap:10px}
.cta{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--accent);text-decoration:none;min-height:72px}
.cta-primary{background:var(--accent);color:var(--on-accent)}
.cta-primary:hover{background:var(--accent-strong)}
.cta-secondary{background:var(--surface);color:var(--accent-strong)}
.cta-secondary:hover{background:var(--accent-soft)}
.cta-t{font-weight:700;font-size:17px;display:block}
.cta-d{font-size:13px;display:block;opacity:.9}
.cta .icon{width:24px;height:24px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:step}
.step a{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--fg);height:100%}
.step a:hover{border-color:var(--accent)}
.step-n{grid-row:span 2;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.step-t{font-weight:700}
.step-d{font-size:14px;color:var(--muted);line-height:1.6}
.voices-entry{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.voices-entry .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:0}
.fact b{font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.qlist{list-style:none;display:grid;gap:6px;font-size:15px}
.qlist li{display:flex;gap:8px;align-items:baseline}
.qlist .qn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:2.5em}
.news{list-style:none;border-top:1px solid var(--line)}
.news li{display:grid;grid-template-columns:110px 96px 1fr;gap:6px 14px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.news time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

/* ---------- Basic detail ---------- */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:start}
.detail-main{min-width:0;max-width:780px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.meta div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.meta dt{font-size:12px;color:var(--muted)}
.meta dd{margin:0;font-size:15px;font-weight:700}
.meta .meta-link{display:flex;align-items:center;border-right:0}
.summary{margin-top:24px;background:var(--accent-soft);border-radius:var(--radius);padding:16px 18px}
.summary h2{font-size:17px;margin-bottom:6px;color:var(--accent-strong)}
.summary ul{padding-left:1.3em;display:grid;gap:4px}
.doc-sec{margin-top:36px}
.doc-sec > h2{font-size:21px;padding-bottom:8px;border-bottom:2px solid var(--line);margin-bottom:14px}
.doc-sec p+p{margin-top:10px}
.prose{display:grid;gap:10px;max-width:42em}
.bullets{padding-left:1.3em;display:grid;gap:6px}
.numbered{padding-left:1.6em;display:grid;gap:6px}
.facts-dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);margin:0}
.facts-dl dt,.facts-dl dd{padding:10px 14px;border-bottom:1px solid var(--line);margin:0}
.facts-dl dt{background:var(--surface-2);font-size:14px;font-weight:700}
.facts-dl > :nth-last-child(-n+2){border-bottom:0}
.pending{display:inline-flex;align-items:center;font-size:12px;padding:1px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);margin-left:6px;white-space:nowrap;vertical-align:2px}
.timeline{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative;margin-top:6px}
.tl-step{position:relative;padding:0 10px 0 0;display:grid;gap:6px;align-content:start}
.tl-dot{display:flex;align-items:center;gap:0}
.tl-dot b{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;z-index:1}
.tl-dot i{flex:1;height:2px;background:var(--accent);opacity:.5}
.tl-step:last-child .tl-dot i{visibility:hidden}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:2px}
.tl-card strong{font-size:17px}
.tl-when{font-size:14px;color:var(--demo-fg);background:var(--demo-bg);border-radius:4px;padding:1px 6px;justify-self:start}
.tl-card span:last-child{font-size:14px;color:var(--muted)}
.diagram{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr) auto minmax(0,1.1fr);gap:10px;align-items:stretch}
.dg-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:8px;align-content:start}
.dg-box h3{font-size:15px}
.dg-arrow{display:flex;align-items:center;justify-content:center;color:var(--accent)}
.dg-arrow .icon{width:28px;height:28px}
.subj-chips{display:flex;flex-wrap:wrap;gap:6px}
.subj-chip{font-size:14px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.subj-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.q-cell{text-align:center;font-size:13px;padding:4px 0;border-radius:4px;border:1px solid var(--line)}
.q-cell.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.figcap{font-size:13px;color:var(--muted);margin-top:8px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch}
.table-wrap:focus-visible{outline-offset:0}
table{border-collapse:collapse;width:100%;font-size:15px}
.wide{min-width:640px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--surface-2);font-size:14px;white-space:nowrap}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-hint{font-size:13px;color:var(--muted);margin-top:6px;display:none}
.history{list-style:none;display:grid;gap:4px;font-size:15px}
.history li{display:flex;gap:12px}
.history time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.report{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface)}
.report p{font-size:15px}
.pager{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--fg);min-height:64px}
.pager a:hover{border-color:var(--accent)}
.pager .dir{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pager .next{text-align:right}
.pager .next .dir{justify-content:flex-end}
.pager b{font-size:16px}
.aside-sticky{position:sticky;top:calc(var(--hh) + 16px);display:grid;gap:20px}
.aside-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.aside-block h2{font-size:14px;color:var(--muted);padding:2px 8px 8px;letter-spacing:.04em}
.toc,.side-list{list-style:none;display:grid;gap:2px}
.toc a,.side-list a{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--fg);font-size:15px;line-height:1.45}
.toc a:hover,.side-list a:hover{background:var(--surface-2)}
.side-list a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.side-list .icon{color:var(--accent)}
.toc-mobile{margin-top:16px}

/* ---------- Voices ---------- */
.filters{display:grid;gap:14px}
.filter-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.filter-label{font-weight:700;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.seg button[aria-pressed="true"]::before{content:"✓"}
.state-demo{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.state-demo .seg button{border-style:dashed}
.condition{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.count-big{display:grid;gap:0;padding-right:20px;border-right:1px solid var(--line)}
.count-big b{font-size:34px;font-variant-numeric:tabular-nums;line-height:1.2}
.count-big span{font-size:13px;color:var(--muted)}
.cond-list{list-style:none;display:grid;gap:4px;font-size:15px}
.cond-list li{display:flex;gap:8px}
.cond-list .k{color:var(--muted);min-width:5.5em}
.vgroup{margin-top:48px}
.vgroup-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vgroup-head .q-badge{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--surface)}
.vgroup-head h2{font-size:22px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px}
.vcard + .vcard{margin-top:14px}
.vcard-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.vcard-head h3{font-size:18px;margin-right:auto}
.vcard-desc{font-size:15px;color:var(--muted);max-width:46em}
.barlist{list-style:none;display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(7em,11em) minmax(0,1fr) 4.5em;gap:10px;align-items:center}
.bar-label{font-size:15px}
.bar-track{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{display:block;height:100%;background:var(--bar-1);border-radius:0 4px 4px 0;min-width:2px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.bar-row.is-hidden .bar-track{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px);border:1px dashed var(--line)}
.bar-hidden-txt{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.bar-row.is-hidden .bar-val{color:var(--muted);font-weight:400}
.hidden-cell{color:var(--muted);font-size:13px;white-space:nowrap}
.hidden-notice{display:flex;gap:10px;align-items:flex-start;padding:16px;border:1px dashed var(--muted);border-radius:var(--radius);background:repeating-linear-gradient(45deg,var(--surface) 0 10px,var(--surface-2) 10px 20px);color:var(--fg);font-size:15px}
.hidden-notice .icon{color:var(--muted);margin-top:3px}
.hidden-notice strong{display:block}
.secondary-note{font-size:13px;color:var(--muted)}
.rank-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.rank-cell .mini{flex:1;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rank-cell .mini i{display:block;height:100%;background:var(--bar-1)}
.rank-cell b{font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two-col .vcard + .vcard{margin-top:0}
.materials{list-style:none;display:grid;gap:6px}
.materials li{display:flex;gap:8px;align-items:baseline;font-size:15px}
.materials li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none;transform:translateY(-2px)}
.comments{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.comment{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px;align-content:space-between}
.comment p{font-size:15px}
.comment footer{font-size:12px;color:var(--muted)}

/* ---------- FAQ ---------- */
.faq-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.faq-cats{position:sticky;top:calc(var(--hh) + 16px)}
.faq-cat{margin-bottom:28px}
.faq-cat h2{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.faq-cat .acc{background:var(--surface)}
.faq-cat .acc:first-of-type{border-top:1px solid var(--line)}
.qa-q{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);font-size:13px;flex:none}
.qa-a{display:flex;gap:10px;font-size:15px}
.qa-a .qa-q{background:var(--surface-2);color:var(--muted)}

/* ---------- About / form ---------- */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:start}
.about-main{min-width:0;max-width:780px}
.status-box{border:2px solid var(--accent);border-radius:var(--radius);padding:14px 16px;background:var(--accent-soft);display:grid;gap:4px}
form{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.req,.opt{font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px}
.req{background:var(--danger-soft);color:var(--danger)}
.opt{background:var(--surface-2);color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.field textarea{min-height:140px;resize:vertical;line-height:1.6}
.field [aria-invalid="true"]{border-color:var(--danger);outline:1px solid var(--danger)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--danger);font-weight:700}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.future{border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14px;color:var(--muted)}

/* ---------- Footer ---------- */
.site-footer{background:var(--surface);border-top:1px solid var(--line);margin-top:24px}
.footer-in{padding-block:32px 24px;display:grid;gap:24px}
.fcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.fcol h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.flinks{list-style:none;display:grid;gap:0}
.flinks a{display:flex;align-items:center;min-height:40px;color:var(--fg);text-decoration:none;font-size:15px}
.flinks a:hover{color:var(--accent-strong);text-decoration:underline}
.flinks a[aria-current="page"]{color:var(--accent-strong);font-weight:700}
.fbottom{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.fbottom strong{color:var(--fg)}
.facc .acc-panel{padding:0 12px 8px}

/* ---------- Home (3 entrances) ---------- */
.home{padding-block:48px 72px;display:grid;gap:36px}
.home-hero{display:grid;gap:14px;max-width:46em}
.home-hero h1{font-size:clamp(28px,4.2vw,40px);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.home-hero h1:focus{outline:none}
.home-beta{font-size:14px;font-weight:700;color:var(--accent-strong);border:1.5px solid var(--accent);border-radius:6px;padding:2px 8px;letter-spacing:0}
.home-hero .lead{font-size:17px;line-height:1.8;color:var(--fg)}
.home-entries{display:grid;gap:16px}
.start-hint{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--accent-strong);background:var(--accent-soft);padding:8px 16px;border-radius:999px}
.entries{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.entry{display:flex;flex-direction:column;gap:14px;height:100%;padding:28px 24px 24px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;text-decoration:none;color:var(--fg)}
.entry:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(23,76,166,.10)}
.entry.is-first{border:2px solid var(--accent)}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.entry-num{font-size:30px;font-weight:700;line-height:1;color:var(--accent-strong)}
.entry-ico{width:48px;height:48px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center}
.entry-ico .icon{width:26px;height:26px}
.entry h2{font-size:24px;font-weight:700}
.entry p{font-size:16px;line-height:1.7;color:var(--fg)}
.entry-btn{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:12px 18px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);font-weight:700;font-size:16px}
.entry.is-first .entry-btn{background:var(--accent);color:var(--on-accent)}
.entry:hover .entry-btn{background:var(--accent-strong);color:var(--on-accent)}
.home-note{font-size:14px;color:var(--muted)}
/* ---------- Back link / mini TOC / related ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;padding:0 14px 0 8px;font-weight:700;font-size:15px;color:var(--accent-strong);text-decoration:none;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.back-link:hover{border-color:var(--accent)}
.page-end{margin-top:16px}
.mini-toc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0 4px}
.mini-toc-lbl{font-size:14px;font-weight:700;color:var(--muted);margin-right:4px}
.mini-toc a{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);font-size:14px}
.mini-toc a:hover{border-color:var(--accent);color:var(--accent-strong)}
.related-links{margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.related-links h2{font-size:15px;color:var(--muted);margin-bottom:6px}
.related-links ul{list-style:none;display:grid;gap:2px}
.related-links a{display:inline-flex;align-items:center;min-height:40px;font-size:15px}
.dnav-group{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:16px 12px 4px;padding-top:12px;border-top:1px solid var(--line)}
.dnav-small .dnav-link{font-size:15px;min-height:44px}
.fmain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.fcol h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.site-footer .fcols{grid-template-columns:repeat(3,minmax(0,1fr))}

@media (max-width:720px){.home{padding-block:28px 48px;gap:24px}.site-footer .fcols{grid-template-columns:minmax(0,1fr);gap:8px}.fmain{gap:16px}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:90;font-size:15px;max-width:calc(100vw - 32px)}

.part-tag.p2{background:var(--accent-soft);border:1px solid var(--line);color:var(--accent-strong)}
@media(min-width:1024px) and (max-width:1200px){.gnav-link{padding:0 8px;font-size:14px}.search{width:180px}.header-in{gap:10px}.brand-name{font-size:17px}}

const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } };
function scrollToAnchor(id){
  if (!id){ window.scrollTo(0, 0); return; }
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
}
const NavCtx = createContext(null);
const useNav = () => useContext(NavCtx);

function NavLink({ route, anchor, className, children, current, onClick, ...rest }){
  const { navigate } = useNav();
  return html`<a href=${'#' + route} className=${className} aria-current=${current ? 'page' : undefined}
    onClick=${e => { e.preventDefault(); if (onClick) onClick(); navigate(route, anchor); }} ...${rest}>${children}</a>`;
}

function useMedia(q){
  const get = () => { try { return matchMedia(q).matches; } catch(e){ return false; } };
  const [m, setM] = useState(get);
  useEffect(() => {
    let mq; try { mq = matchMedia(q); } catch(e){ return; }
    const on = () => setM(mq.matches);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    on();
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, [q]);
  return m;
}

);
const norm = s => (s || '').toLowerCase().normalize('NFKC');
function runSearch(q){
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return SEARCH_INDEX.filter(e => { const hay = norm(e.title + ' ' + e.cat + ' ' + (e.kw || '')); return terms.every(t => hay.includes(t)); }).slice(0, 10);
}
function highlight(text, q){
  const t = norm(q).split(/\s+/).filter(Boolean)[0];
  if (!t) return text;
  const i = norm(text).indexOf(t);
  if (i < 0) return text;
  return html`${text.slice(0, i)}<mark>${text.slice(i, i + t.length)}</mark>${text.slice(i + t.length)}`;
}

function Search({ id, autoFocus, onNavigate }){
  const { navigate } = useNav();
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const wrap = useRef(null), input = useRef(null);
  const results = useMemo(() => runSearch(q), [q]);
  useEffect(() => { if (autoFocus && input.current) input.current.focus(); }, [autoFocus]);
  useEffect(() => {
    const on = e => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', on);
    return () => document.removeEventListener('mousedown', on);
  }, []);
  const go = r => { setOpen(false); setQ(''); if (onNavigate) onNavigate(); navigate(r.route, r.anchor); };
  const clear = () => { setQ(''); input.current && input.current.focus(); };
  const show = open && q.trim();
  return html`<div className="search" role="search" ref=${wrap}>
    <label className="sr-only" htmlFor=${id}>サイト内を検索</label>
    <div className="search-field">
      <${Icon} name="search"/>
      <input id=${id} ref=${input} type="text" autoComplete="off" placeholder="ページ・項目を検索" value=${q}
        aria-controls=${id + '-results'} aria-expanded=${show ? 'true' : 'false'}
        onChange=${e => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)}
        onKeyDown=${e => { if (e.key === 'Escape'){ if (q) setQ(''); else setOpen(false); } if (e.key === 'Enter' && results[0]) go(results[0]); }}/>
      ${q && html`<button type="button" className="search-clear" onClick=${clear} aria-label="検索語をクリア"><${Icon} name="close"/></button>`}
    </div>
    ${show && html`<div className="search-panel" id=${id + '-results'} aria-live="polite">
      ${results.length ? html`
        <p className="search-count">「${q}」の検索結果：${results.length}件</p>
        <ul className="search-results">${results.map((r, i) => html`<li key=${i}><button type="button" onClick=${() => go(r)}>
          <span className="r-title">${highlight(r.title, q)}</span><span className="r-cat">${r.cat}</span></button></li>`)}</ul>`
      : html`<div className="search-empty">
          <p>「${q}」に一致するページは見つかりませんでした。</p>
          <p className="note">ほかの言葉で試してください。例：</p>
          <div className="chips">${['日程', 'TOEIC', '口頭', '過去問', '大問'].map(w => html`<button type="button" key=${w} className="chip" onClick=${() => { setQ(w); input.current && input.current.focus(); }}>${w}</button>`)}</div>
        </div>`}
    </div>`}
  </div>`;
}

/* ---------- Accordion (shared) ---------- */
function Accordion({ id, title, children, defaultOpen = false, open, onToggle, variant, level = 3, meta, extraClass = '', showStateText = true }){
  const [inner, setInner] = useState(defaultOpen);
  const isOpen = open !== undefined ? open : inner;
  const toggle = () => { if (onToggle) onToggle(!isOpen); else setInner(!isOpen); };
  const H = 'h' + level;
  return html`<div className=${'acc' + (variant ? ' acc--' + variant : '') + (isOpen ? ' is-open' : '') + (extraClass ? ' ' + extraClass : '')}>
    <${H} className="acc-h">
      <button type="button" className="acc-btn" id=${id + '-btn'} aria-expanded=${isOpen ? 'true' : 'false'} aria-controls=${id + '-panel'} onClick=${toggle}>
        <span className="acc-title">${title}</span>
        ${meta && html`<span className="acc-meta">${meta}</span>`}
        <span className="acc-state" aria-hidden="true">${showStateText && (isOpen ? '閉じる' : '開く')}<${Icon} name="chevron"/></span>
      </button>
    <//>
    <div id=${id + '-panel'} role="region" aria-labelledby=${id + '-btn'} className="acc-panel" hidden=${!isOpen}>${children}</div>
  </div>`;
}

/* ---------- Drawer (hamburger menu) ---------- */
function Drawer({ onClose }){
  const { route } = useNav();
  const panel = useRef(null), closeBtn = useRef(null);
  const [openSec, setOpenSec] = useState(() => ({ basic: inSection(route, 'basic'), subjects: inSection(route, 'subjects') }));
  useEffect(() => {
    document.body.classList.add('no-scroll');
    const t = setTimeout(() => closeBtn.current && closeBtn.current.focus(), 0);
    const onEsc = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onEsc);
    return () => { clearTimeout(t); document.removeEventListener('keydown', onEsc); document.body.classList.remove('no-scroll'); };
  }, []);
  const onKey = e => {
    if (e.key === 'Escape'){ e.stopPropagation(); onClose(); return; }
    if (e.key !== 'Tab') return;
    const f = panel.current.querySelectorAll('button:not([disabled]), a[href], input, [tabindex]:not([tabindex="-1"])');
    const vis = Array.from(f).filter(el => el.offsetParent !== null);
    if (!vis.length) return;
    const first = vis[0], last = vis[vis.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  return html`<div onKeyDown=${onKey}>
    <div className="drawer-backdrop" onClick=${onClose} aria-hidden="true"></div>
    <div className="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" ref=${panel}>
      <div className="drawer-head">
        <h2 id="drawer-title">メニュー</h2>
        <button type="button" className="icon-btn" ref=${closeBtn} onClick=${onClose}><${Icon} name="close"/><span>閉じる</span></button>
      </div>
      <nav className="drawer-body" aria-label="サイトメニュー">
        <ul className="dnav">${NAV.map(item => {
          if (!item.children){
            return html`<li key=${item.route}><${NavLink} route=${item.route} className="dnav-link" current=${route === item.route}><${Icon} name=${item.icon}/>${item.label}<//></li>`;
          }
          const cur = inSection(route, item.route);
          return html`<li key=${item.route}><${Accordion} id=${'dn-' + item.route} variant="nav" level=${3} extraClass=${cur ? 'is-current' : ''} showStateText=${false}
              open=${!!openSec[item.route]} onToggle=${v => setOpenSec(s => ({ ...s, [item.route]: v }))}
              title=${html`<${Icon} name=${item.icon}/>${item.label}${cur ? html`<span className="sr-only">（現在のカテゴリ）</span>` : null}`}>
            <ul className="dnav-sub">${item.children.map((c, i) => {
              const curChild = !c.anchor && c.route === route;
              return html`<li key=${i}><${NavLink} route=${c.route} anchor=${c.anchor} className="dnav-link" current=${curChild}>${c.label}<//></li>`; })}</ul>
          <//></li>`; })}</ul>
        <h3 className="dnav-group">サイトについて</h3>
        <ul className="dnav dnav-small">${NAV_SITE.map((item, i) => html`<li key=${i}><${NavLink} route=${item.route} anchor=${item.anchor} className="dnav-link" current=${!item.anchor && route === item.route}><${Icon} name=${item.icon}/>${item.label}<//></li>`)}</ul>
        <p className="drawer-note">${C.site.demoNote}<br/>${C.site.unofficial}</p>
      </nav>
    </div>
  </div>`;
}

/* =====================================================================
   Survey aggregation (all demo data). Privacy rules:
   - groups with fewer than minGroup answers are not shown
   - when a single cell is hidden in a set that sums to a known total, the smallest other
     cell is also hidden so the hidden one can't be recovered by subtraction
   - "all years" pools only years that themselves have ≥ minGroup answers
===================================================================== */
const S = C.survey, MIN = S.minGroup;
const KEY2ID = Object.fromEntries(S.subjects.map(s => [s.key, s.id]));
const RESP = S.raw.map((line, idx) => {
  const [year, kei, start, subs, score, oral, cm] = line.split('|');
  const picks = subs.split(' ').map((t, r) => ({ subj: KEY2ID[t[0]], qs: t.slice(1).split('').map(Number), rank: r + 1 }));
  picks.forEach(p => { const pool = S.materials[p.subj]; p.material = pool[(idx + p.rank) % pool.length]; });
  return { year, kei: +kei, start: +start, picks, score: KEY2ID[score], oral: oral.split('').map(Number), comment: cm === '-' ? null : S.comments[+cm] };
});
function suppress(values, sumKnown = true){
  const hidden = values.map(v => v > 0 && v < MIN);
  let secondary = false;
  if (sumKnown && hidden.filter(Boolean).length === 1){
    let m = -1;
    values.forEach((v, i) => { if (!hidden[i] && v > 0 && (m < 0 || v < values[m])) m = i; });
    if (m >= 0){ hidden[m] = true; secondary = true; }
  }
  return { values, hidden, secondary };
}
const subjCounts = rows => S.subjects.map(s => rows.filter(r => r.picks.some(p => p.subj === s.id)).length);
function aggregate(year, subj){
  let base, excluded = [];
  if (year === 'all'){
    const ok = S.years.filter(y => RESP.filter(r => r.year === y.v).length >= MIN).map(y => y.v);
    excluded = S.years.filter(y => !ok.includes(y.v)).map(y => y.label);
    base = RESP.filter(r => ok.includes(r.year));
  } else base = RESP.filter(r => r.year === year);
  let rows = base, blocked = null;
  if (base.length < MIN) blocked = 'few';
  if (!blocked && subj !== 'all'){
    rows = base.filter(r => r.picks.some(p => p.subj === subj));
    const parent = suppress(subjCounts(base));
    if (rows.length < MIN) blocked = 'few';
    else if (parent.hidden[S.subjects.findIndex(s => s.id === subj)]) blocked = 'derive';
  }
  if (blocked) return { blocked, excluded };
  const n = rows.length;
  const count = (arr, fn) => arr.map((_, i) => rows.filter(r => fn(r, i)).length);
  const subjSup = suppress(subjCounts(rows));
  const visibleSubj = S.subjects.map((s, i) => subjSup.values[i] >= MIN && !subjSup.hidden[i]);
  const perSubject = S.subjects.map((s, i) => {
    if (!visibleSubj[i]) return null;
    const ps = rows.map(r => r.picks.find(p => p.subj === s.id)).filter(Boolean);
    return {
      qs: suppress([1, 2, 3, 4].map(q => ps.filter(p => p.qs.includes(q)).length)),
      rank: suppress([1, 2, 3].map(k => ps.filter(p => p.rank === k).length)),
      materials: Array.from(new Set(ps.map(p => p.material)))
    };
  });
  const comments = rows.map(r => r.comment).filter(Boolean);
  return {
    n, excluded,
    kei: suppress(count(S.kei, (r, i) => r.kei === i)),
    start: suppress(count(S.starts, (r, i) => r.start === i)),
    subj: subjSup, perSubject,
    score: suppress(count(S.subjects, (r, i) => r.score === S.subjects[i].id)),
    oral: suppress(count(S.oral, (r, i) => r.oral.includes(i)), false),
    comments: comments.length >= MIN ? comments.slice(0, 6) : null
  };
}

      <//>

      <//>
    <//>
  </div>`;
}

const FORM_TYPES = [{ v: 'question', l: '質問' }, { v: 'report', l: '誤り・更新情報の報告' }, { v: 'request', l: '掲載してほしい内容の要望' }, { v: 'other', l: 'その他' }];
const FORM_PAGES = [{ v: '', l: '指定しない' }].concat(PAGES.map(p => ({ v: 'basic-' + p.id, l: '基本情報：' + p.title })), SUBJECTS.map(p=>({v:'subject-'+p.id,l:'選択科目：'+p.name})), [{ v: 'voices', l: '先輩たちの声' }, { v: 'faq', l: 'よくある質問' }]);
function ContactForm({ prefill }){
  const empty = { nickname: '', type: '', page: '', body: '' };
  const [v, setV] = useState(empty);
  const [err, setErr] = useState({});
  const [done, setDone] = useState(false);
  const refs = { type: useRef(null), body: useRef(null) };
  useEffect(() => { if (prefill){ setV(x => ({ ...x, type: prefill.type || x.type, page: prefill.page || x.page })); setDone(false); } }, [prefill && prefill.nonce]);
  const set = k => e => { setV({ ...v, [k]: e.target.value }); if (err[k]) setErr({ ...err, [k]: null }); setDone(false); };
  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!v.type) er.type = '問い合わせの種類を選んでください。';
    if (v.body.trim().length < 10) er.body = '内容を10文字以上で入力してください。';
    setErr(er);
    if (Object.keys(er).length){ const k = er.type ? 'type' : 'body'; refs[k].current && refs[k].current.focus(); setDone(false); return; }
    setDone(true);
  };
  return html`<form onSubmit=${submit} noValidate aria-describedby="form-demo-note">
    <div className="demo-box" id="form-demo-note" role="note"><strong>デモのため送信されません</strong><span>入力内容の確認だけを行います。内容はどこにも送信・保存されません。</span></div>
    <div className="field"><label htmlFor="f-nick">ニックネーム<span className="opt">任意</span></label>
      <input id="f-nick" type="text" value=${v.nickname} onChange=${set('nickname')} maxLength="30" aria-describedby="f-nick-h"/>
      <span className="hint" id="f-nick-h">本名や学籍番号は入力しないでください。</span></div>
    <div className="field"><label htmlFor="f-type">問い合わせの種類<span className="req">必須</span></label>
      <select id="f-type" ref=${refs.type} value=${v.type} onChange=${set('type')} aria-invalid=${err.type ? 'true' : 'false'} aria-describedby=${err.type ? 'f-type-e' : undefined}>
        <option value="">選んでください</option>${FORM_TYPES.map(t => html`<option key=${t.v} value=${t.v}>${t.l}</option>`)}</select>
      ${err.type && html`<span className="err" id="f-type-e">${err.type}</span>`}</div>
    <div className="field"><label htmlFor="f-page">関係するページ<span className="opt">任意</span></label>
      <select id="f-page" value=${v.page} onChange=${set('page')}>${FORM_PAGES.map(t => html`<option key=${t.v} value=${t.v}>${t.l}</option>`)}</select></div>
    <div className="field"><label htmlFor="f-body">内容<span className="req">必須</span></label>
      <textarea id="f-body" ref=${refs.body} value=${v.body} onChange=${set('body')} maxLength="1000" aria-invalid=${err.body ? 'true' : 'false'} aria-describedby=${'f-body-h' + (err.body ? ' f-body-e' : '')}></textarea>
      <span className="hint" id="f-body-h">${v.body.length}/1000文字。回答は非公開で行い、公開のコメント欄はありません。</span>
      ${err.body && html`<span className="err" id="f-body-e">${err.body}</span>`}</div>
    <div className="form-actions">
      <button type="submit" className="btn">入力内容を確認する</button>
      <button type="button" className="btn btn-sub" onClick=${() => { setV(empty); setErr({}); setDone(false); }}>入力をクリア</button>
    </div>
    <div role="status" aria-live="polite">${done && html`<div className="status-box"><strong>入力内容に問題はありません</strong>
      <span>デモのため、この内容は送信も保存もされていません。種類：${FORM_TYPES.find(t => t.v === v.type).l}${v.page ? '／' + FORM_PAGES.find(t => t.v === v.page).l : ''}</span></div>`}</div>
  </form>`;
}

          <ul className="bullets"><li>回答が3人未満のグループ（年度・系・科目など）は結果を表示しません。</li><li>大問の選び方は年度ごとに示し、出題傾向の断定はしません。</li>

        <section className="doc-sec" aria-labelledby="access"><h2 id="access">閲覧範囲について</h2>
          <div className="prose"><p>本番では、学校アカウントで閲覧を限定する仕組みを、公開するサービス側で別に設定する予定です。</p>
            <p><strong>このデモには閲覧制限が入っていません。</strong>画面上の表示・非表示の切り替えは、閲覧制限の代わりにはなりません。「転載禁止」の表示も、転載を技術的に防ぐものではありません。</p></div></section>
        <section className="doc-sec" aria-labelledby="privacy"><h2 id="privacy">プライバシー方針（仮）<span className="pending">仮表示</span></h2>
          <ul className="bullets"><li>問い合わせフォームで受け取るのは、ニックネーム（任意）・種類・内容だけを想定しています。</li><li>アンケートは匿名で集計し、メールアドレスは記録しません。</li>
            <li>受け取った内容は運営元だけが確認し、公開しません。</li><li>正式な方針は、運営元で確認したうえで掲載します。</li></ul></section>
        <section className="doc-sec" aria-labelledby="contact"><h2 id="contact">質問・誤り報告フォーム</h2>
          <p className="note" style=${{ marginBottom: '14px' }}>質問や誤りの指摘は非公開で受け付けます。公開のコメント欄は設けていません。</p>
          <${ContactForm} prefill=${prefill}/></section>
        <div className="future" style=${{ marginTop: '36px' }}>第2部の選択科目ページは、基本情報・過去問の大問例・対策法・参考資料の掲載欄を用意しています。本文は今後執筆します。</div>
      </div>
      ${!compact && html`<aside aria-label="補助ナビゲーション"><div className="aside-sticky"><nav className="aside-block" aria-label="このページの目次"><h2>このページの目次</h2>
        <ol className="toc">${toc.map(([id, l]) => html`<li key=${id}><a href=${'#' + id} onClick=${e => { e.preventDefault(); scrollToAnchor(id); }}>${l}</a></li>`)}</ol></nav></div></aside>`}

/* ---------- App ---------- */
function App(){
  const [route, setRoute] = useState(readHash);
  const [menuOpen, setMenuOpen] = useState(false);
  const [prefill, setPrefill] = useState(null);
  const pending = useRef(null), first = useRef(true), menuBtn = useRef(null), routeRef = useRef(route);
  routeRef.current = route;

  const navigate = useCallback((r, anchor, opts) => {
    if (opts && opts.prefill) setPrefill({ ...opts.prefill, nonce: Date.now() });
    setMenuOpen(false);
    if (r === routeRef.current){ setTimeout(() => scrollToAnchor(anchor), 30); return; }
    pending.current = anchor || null;
    try { history.pushState(null, '', '#' + r); } catch(e){}
    setRoute(r);
  }, []);

  useEffect(() => { const on = () => { pending.current = null; setRoute(readHash()); }; window.addEventListener('popstate', on); window.addEventListener('hashchange', on);
    return () => { window.removeEventListener('popstate', on); window.removeEventListener('hashchange', on); }; }, []);

  useEffect(() => {
    if (first.current){ first.current = false; return; }
    const a = pending.current; pending.current = null;
    requestAnimationFrame(() => {
      if (a) scrollToAnchor(a);
      else { window.scrollTo(0, 0); const h = document.querySelector('main h1'); if (h) h.focus({ preventScroll: true }); }
    });
  }, [route]);

  const closeMenu = useCallback(() => { setMenuOpen(false); setTimeout(() => menuBtn.current && menuBtn.current.focus(), 0); }, []);
  const compact = useMedia('(max-width: 1023px)');
  useEffect(() => { if (!compact && menuOpen) setMenuOpen(false); }, [compact]);

  let page;
  if (route === 'home') page = html`<${Home}/>`;
  else if (route === 'basic') page = html`<${BasicList}/>`;
  else if (route.startsWith('basic-')) page = html`<${BasicDetail} key=${route} page=${PAGES.find(p => 'basic-' + p.id === route)}/>`;
  else if (route === 'subjects') page = html`<${SubjectList}/>`;
  else if (route.startsWith('subject-')) page = html`<${SubjectDetail} key=${route} subject=${SUBJECTS.find(p => 'subject-'+p.id === route)}/>`;
  else if (route === 'voices') page = html`<${Voices}/>`;
  else if (route === 'faq') page = html`<${Faq}/>`;
  else page = html`<${About} prefill=${prefill}/>`;

  return html`<${NavCtx.Provider} value=${{ route, navigate }}>
    <${Header} menuOpen=${menuOpen} onMenu=${() => setMenuOpen(true)} menuBtnRef=${menuBtn}/>
    <main id="main">${page}</main>
    <${Footer}/>
    ${menuOpen && html`<${Drawer} onClose=${closeMenu}/>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
